<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="mama.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="navbar">
      <a href="index.html"><img src="images/HOME.png" alt="" /></a>
    </div>
    <div class="container_1">
      <img src="images/mama_website_pic_1.png" alt="" />
    </div>
    <h3>These are the beautiful paintings done by my mom</h3>
    <div class="photo_gallery">
      <img src="yang_pictures/pic_1.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_2.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_3.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_4.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_5.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_6.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_7.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_8.jpeg" onclick="FullView(this.src)" alt="" />
      <img src="yang_pictures/pic_9.jpeg" onclick="FullView(this.src)" alt="" />
      <img
        src="yang_pictures/pic_10.jpeg"
        onclick="FullView(this.src)"
        alt=""
      />
    </div>

    <div id="FullImageView">
      <img id="FullImage" />
      <span id="CloseButton" onclick="CloseFullView()">×</span>
    </div>

    <script type="text/javascript">
      function FullView(ImgLink) {
        document.getElementById("FullImage").src = ImgLink;
        document.getElementById("FullImageView").style.display = "block";
      }
      function CloseFullView() {
        document.getElementById("FullImageView").style.display = "none";
      }
    </script>
  </body>
</html>
